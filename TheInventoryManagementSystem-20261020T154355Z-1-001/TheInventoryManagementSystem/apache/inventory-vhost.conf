# Apache 2.4 hardening and HTTPS reverse proxy for the Flask application.
# Replace inventory.example.com and the certificate paths with your own.
#
# Enable: headers, ssl, proxy, proxy_http, rewrite, reqtimeout.
# Keep this file private to the Apache host; never expose the app port publicly.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<VirtualHost *:80>
    ServerName inventory.example.com
    RewriteEngine On
    RewriteRule ^ https://inventory.example.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName inventory.example.com
    DocumentRoot "/var/www/empty"
    Options -Indexes

    SSLEngine On
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLCertificateFile /etc/letsencrypt/live/inventory.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/inventory.example.com/privkey.pem

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

    ProxyRequests Off
    ProxyPreserveHost Off
    ProxyTimeout 30
    RequestHeader unset X-Forwarded-Proto
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader unset X-Forwarded-Host
    RequestHeader set X-Forwarded-Host "inventory.example.com"
    RequestHeader unset X-Forwarded-Port
    RequestHeader set X-Forwarded-Port "443"

    LimitRequestBody 16384
    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500

    <LocationMatch "(?i)^/(?:\.|data(?:/|$)|database(?:/|$)|backend(?:/|$)|config\.py$|app\.py$)">
        Require all denied
    </LocationMatch>

    ProxyPass / http://127.0.0.1:5000/ retry=0
    ProxyPassReverse / http://127.0.0.1:5000/
</VirtualHost>

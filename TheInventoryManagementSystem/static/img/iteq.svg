<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="ITEQ">
  <!-- ITEQ brand mark: rounded square with the ITEQ wordmark, matching the
       .brand-mark element used in the sidebar and on the login banner.
       A thin outline keeps the badge readable on white browser tab strips. -->
  <rect x="1.6" y="1.6" width="60.8" height="60.8" rx="11"
        fill="#ffffff" stroke="#111111" stroke-width="3.2"/>
  <text x="32" y="40.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="22"
        font-weight="800" letter-spacing="-0.3" fill="#111111">ITEQ</text>
</svg>
